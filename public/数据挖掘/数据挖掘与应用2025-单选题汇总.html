// 全局变量
let currentChapter = null;
let currentProblemIndex = 0;
let correctCount = 0;
let selectedAnswer = null;
let bookmarkedProblems = JSON.parse(localStorage.getItem('bookmarkedProblems')) || {};

// 初始化章节按钮
function initChapters() {
  const chapterList = document.getElementById('chapterList');
  
  radioProblem.forEach(chapter => {
    const btn = document.createElement('button');
    btn.className = 'chapter-btn';
    btn.textContent = chapter.class;
    btn.addEventListener('click', () => selectChapter(chapter));
    chapterList.appendChild(btn);
  });
}

// 选择章节
function selectChapter(chapter) {
  currentChapter = chapter;
  currentProblemIndex = 0;
  correctCount = 0;
  
  document.getElementById('questionContainer').style.display = 'block';
  updateStats();
  loadProblem();
}

// 加载当前题目
function loadProblem() {
  const problem = currentChapter.problems[currentProblemIndex];
  
  // 更新问题标题
  document.getElementById('questionTitle').innerHTML = `
    <strong>${currentProblemIndex + 1}/${currentChapter.problems.length}</strong> 
    (${problem.score}分) ${problem.content}
  `;
  
  // 清空选项列表
  const optionsList = document.getElementById('optionsList');
  optionsList.innerHTML = '';
  
  // 添加选项
  problem.options.forEach((option, index) => {
    const optionItem = document.createElement('div');
    optionItem.className = 'option-item';
    optionItem.textContent = option;
    optionItem.dataset.value = option.charAt(0); // 存储选项字母(A/B/C/D)
    optionItem.addEventListener('click', () => selectOption(optionItem));
    
    // 添加收藏图标
    const bookmarkIcon = document.createElement('span');
    bookmarkIcon.className = 'bookmark-icon';
    bookmarkIcon.innerHTML = '★';
    bookmarkIcon.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleBookmark(problem.id);
      updateBookmarkIcon(bookmarkIcon, problem.id);
    });
    updateBookmarkIcon(bookmarkIcon, problem.id);
    
    optionItem.appendChild(bookmarkIcon);
    optionsList.appendChild(optionItem);
  });
  
  // 隐藏反馈和解析
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('explanation').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  
  // 重置选中的答案
  selectedAnswer = null;
  updateProgress();
}

// 更新收藏图标状态
function updateBookmarkIcon(icon, problemId) {
  if (bookmarkedProblems[problemId]) {
    icon.classList.add('active');
  } else {
    icon.classList.remove('active');
  }
}

// 切换收藏状态
function toggleBookmark(problemId) {
  if (bookmarkedProblems[problemId]) {
    delete bookmarkedProblems[problemId];
  } else {
    bookmarkedProblems[problemId] = true;
  }
  localStorage.setItem('bookmarkedProblems', JSON.stringify(bookmarkedProblems));
}

// 选择选项
function selectOption(optionItem) {
  if (document.getElementById('feedback').style.display === 'block') {
    return; // 如果已经显示了反馈，不允许再次选择
  }
  
  // 清除之前选中的选项
  document.querySelectorAll('.option-item').forEach(item => {
    item.classList.remove('selected');
  });
  
  // 选中当前选项
  optionItem.classList.add('selected');
  selectedAnswer = optionItem.dataset.value;
  
  // 检查答案
  checkAnswer();
}

// 检查答案
function checkAnswer() {
  const problem = currentChapter.problems[currentProblemIndex];
  const isCorrect = selectedAnswer === problem.answer;
  const feedback = document.getElementById('feedback');
  const explanation = document.getElementById('explanation');
  
  // 标记正确/错误选项
  document.querySelectorAll('.option-item').forEach(item => {
    if (item.dataset.value === problem.answer) {
      item.classList.add('correct');
    } else if (item.dataset.value === selectedAnswer && !isCorrect) {
      item.classList.add('incorrect');
    }
  });
  
  // 显示反馈
  feedback.style.display = 'block';
  explanation.style.display = 'block';
  
  if (isCorrect) {
    feedback.className = 'feedback correct';
    feedback.textContent = '✓ 回答正确！';
    correctCount++;
  } else {
    feedback.className = 'feedback incorrect';
    feedback.textContent = `✗ 回答错误！正确答案是：${problem.answer}`;
  }
  
  // 显示解析
  if (problem.explanation) {
    explanation.textContent = `解析：${problem.explanation}`;
  } else {
    explanation.textContent = '暂无解析';
  }
  
  // 显示下一题按钮
  document.getElementById('nextBtn').style.display = 'block';
  updateStats();
}

// 下一题
function nextProblem() {
  currentProblemIndex++;
  
  if (currentProblemIndex < currentChapter.problems.length) {
    loadProblem();
  } else {
    // 所有题目已完成
    document.getElementById('questionTitle').textContent = `章节练习完成！`;
    document.getElementById('optionsList').innerHTML = '';
    document.getElementById('feedback').className = 'feedback correct';
    document.getElementById('feedback').textContent = `本章节练习完成！正确率：${Math.round(correctCount/currentChapter.problems.length*100)}% (${correctCount}/${currentChapter.problems.length})`;
    document.getElementById('feedback').style.display = 'block';
    document.getElementById('explanation').style.display = 'none';
    document.getElementById('nextBtn').style.display = 'none';
  }
}

function prevProblem() {
  currentProblemIndex--;
  if (currentProblemIndex >= 0) {
    loadProblem();
  }
}



// 更新统计信息
function updateStats() {
  if (currentChapter) {
    document.getElementById('stats').textContent = 
      `${currentChapter.class} - 进度: ${currentProblemIndex + 1}/${currentChapter.problems.length} | 正确: ${correctCount} | 正确率: ${correctCount > 0 ? Math.round(correctCount/(currentProblemIndex + 1)*100) : 0}%`;
  }
}

// 更新进度条
function updateProgress() {
  const progressPercentage = ((currentProblemIndex + 1) / currentChapter.problems.length) * 100;
  document.getElementById('progressFill').style.width = `${progressPercentage}%`;
}

// 初始化页面
function init() {
  initChapters();
  document.getElementById('nextBtn').addEventListener('click', nextProblem);
  document.getElementById('prevBtn').addEventListener('click', prevProblem);
  document.getElementById('markBtn').addEventListener('click', () => {
    const problem = currentChapter.problems[currentProblemIndex];
    toggleBookmark(problem.id);
    const icon = document.querySelector(`.option-item[data-value="${selectedAnswer}"] .bookmark-icon`);
    if (icon) updateBookmarkIcon(icon, problem.id);
  });
}

// 页面加载完成后初始化
window.addEventListener('DOMContentLoaded', init);
