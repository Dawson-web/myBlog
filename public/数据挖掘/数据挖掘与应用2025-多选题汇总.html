      border: 1px solid #e0e0e0;

    }

       /* background-color: #ecf8f2; */ /* Let user selection override if also selected */
    }
    .option-item.incorrect-choice.selected { /* User selected this, but it was wrong (after check) */

       background-color: #fdf2f2 !important;
    }
     .option-item.missed-choice { /* This was a correct answer but user missed it (after check) */
       /* Example: Add a subtle indicator for missed correct answers if desired */
       /* border-left: 3px solid #ffc107; */
    }

      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-weight: 500;
      display: none;
    }
    .feedback.correct {
      background-color: #ecf8f2;
      color: #0d904f;
      border-left: 4px solid #0d904f;
    }
    .feedback.incorrect {
      background-color: #fdf2f2;
      color: #e53e3e;
      border-left: 4px solid #e53e3e;
    }

      margin-top: 15px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
      border-left: 4px solid #1a73e8;
      display: none;
    }
    .action-btns {
      display: flex;
      justify-content: space-between; 
      gap: 10px; 
      margin-top: 20px;
    }
    .btn {
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 25px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      flex-grow: 1; 
    }
    .btn:hover {
      background-color: #0d62c1;
    }
    .btn[disabled] {
        background-color: #ccc;
        cursor: not-allowed;
    }

      background-color: transparent;
      border: 1px solid #1a73e8;
      color: #1a73e8;

    }

      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

      height: 100%;
      background-color: #1a73e8;
      width: 0%;

      multiplyProblems.forEach(chapter => {
        const btn = document.createElement('button');
        btn.className = 'chapter-btn';
        btn.textContent = chapter.class;
        btn.addEventListener('click', () => selectChapter(chapter));
        chapterListEl.appendChild(btn);
      });
    }

    function selectChapter(chapterData) {
      currentChapterData = chapterData;
      currentProblemIndex = 0;
      correctAnswersCount = 0;
      questionContainerEl.style.display = 'block';
      markBtnEl.style.display = 'inline-block'; // Show mark button when chapter starts
      updateStats();
      loadProblem();
    }

    function loadProblem() {
      feedbackShown = false;
      userSelectedOptions = []; 
      const problem = currentChapterData.problems[currentProblemIndex];

      questionTitleEl.innerHTML = `<strong>${currentProblemIndex + 1}/${currentChapterData.problems.length}</strong> (${problem.score}分) ${problem.content}`;
      optionsListEl.innerHTML = ''; 

      problem.options.forEach(optionText => {
        const optionValue = optionText.charAt(0); 
        const optionItem = document.createElement('div');
        optionItem.className = 'option-item';
        optionItem.textContent = optionText;
        optionItem.dataset.value = optionValue;
        optionItem.addEventListener('click', () => handleOptionSelect(optionItem, optionValue));
        optionsListEl.appendChild(optionItem);
      });

      feedbackEl.style.display = 'none';
      explanationEl.style.display = 'none';
      checkAnswerBtnEl.style.display = 'inline-block';
      checkAnswerBtnEl.disabled = false;
      nextBtnEl.style.display = 'none';
      
      updateBookmarkButton();
      updateProgress();
      updateStats(); 
    }

    function handleOptionSelect(optionItem, optionValue) {
      if (feedbackShown) return; 

      const index = userSelectedOptions.indexOf(optionValue);
      if (index > -1) {
        userSelectedOptions.splice(index, 1); 
        optionItem.classList.remove('selected');
      } else {
        userSelectedOptions.push(optionValue); 
        optionItem.classList.add('selected');
      }
    }
    
    function checkAnswer() {
      if (userSelectedOptions.length === 0) {
        alert("请至少选择一个选项！");
        return;
      }
      feedbackShown = true;
      checkAnswerBtnEl.disabled = true;

      const problem = currentChapterData.problems[currentProblemIndex];
      const correctProblemAnswers = problem.answer.slice().sort(); 
      const userSelectedSorted = userSelectedOptions.slice().sort();

      let isFullyCorrect = correctProblemAnswers.length === userSelectedSorted.length &&
                         correctProblemAnswers.every((val, idx) => val === userSelectedSorted[idx]);

      feedbackEl.style.display = 'block';
      if (isFullyCorrect) {
        feedbackEl.className = 'feedback correct';
        feedbackEl.textContent = '✓ 回答正确！';
        correctAnswersCount++;
      } else {
        feedbackEl.className = 'feedback incorrect';
        feedbackEl.textContent = `✗ 回答错误！正确答案是：${problem.answer.join(', ')}`;
      }

      document.querySelectorAll('.option-item').forEach(item => {
        const val = item.dataset.value;
        // Reset visual states before applying new ones
        item.classList.remove('selected', 'correct-choice', 'incorrect-choice', 'missed-choice');

        if (userSelectedOptions.includes(val)) {
            item.classList.add('selected'); // User picked this
            if (problem.answer.includes(val)) {
                 // User picked a correct option - already styled by 'selected' and will be by 'correct-choice'
            } else {
                item.classList.add('incorrect-choice'); // User picked a wrong option
            }
        }

        if (problem.answer.includes(val)) {
            item.classList.add('correct-choice'); // This is a correct option, mark it
             if (!userSelectedOptions.includes(val)) {
                // item.classList.add('missed-choice'); // User missed this correct one
            }
        }
      });


      if (problem.explanation) {
        explanationEl.innerHTML = `<strong>解析：</strong>${problem.explanation}`; // Use innerHTML for potential formatting
        explanationEl.style.display = 'block';
      } else {
        explanationEl.innerHTML = '<strong>解析：</strong>暂无解析';
        explanationEl.style.display = 'block'; 
      }

      checkAnswerBtnEl.style.display = 'none';
      nextBtnEl.style.display = 'inline-block';
      updateStats(); 
    }

    function nextProblem() {
      currentProblemIndex++;
      if (currentProblemIndex < currentChapterData.problems.length) {
        loadProblem();
      } else {
        questionTitleEl.textContent = `章节练习完成！`;
        optionsListEl.innerHTML = '';
        feedbackEl.className = 'feedback correct';
        feedbackEl.textContent = `本章节练习完成！正确率：${Math.round(correctAnswersCount / currentChapterData.problems.length * 100)}% (${correctAnswersCount}/${currentChapterData.problems.length})`;
        feedbackEl.style.display = 'block';
        explanationEl.style.display = 'none';
        checkAnswerBtnEl.style.display = 'none';
        nextBtnEl.style.display = 'none';
        markBtnEl.style.display = 'none'; 
      }
    }

    function prevProblem() {
        currentProblemIndex--;
        if (currentProblemIndex >= 0) {
            loadProblem();
        }
    }
    
    function updateStats() {
      if (currentChapterData) {
        const totalProblems = currentChapterData.problems.length;
        // For stats, consider a problem "attempted" once its answer is checked.
        const attemptedProblems = feedbackShown ? currentProblemIndex + 1 : currentProblemIndex;
         // Calculate accuracy based on problems where feedback has been shown
        const problemsChecked = currentProblemIndex + (feedbackShown || currentProblemIndex === totalProblems ? 1 : 0);
        // Ensure we don't count the current problem before it's answered for accuracy
        const relevantProblemCountForAccuracy = (currentProblemIndex === totalProblems && feedbackShown) ? totalProblems : (feedbackShown ? currentProblemIndex + 1 : currentProblemIndex);


        let accuracy = 0;
        if (relevantProblemCountForAccuracy > 0) {
            accuracy = Math.round(correctAnswersCount / relevantProblemCountForAccuracy * 100);
        }
        
        statsEl.textContent = 
          `${currentChapterData.class} - 进度: ${currentProblemIndex + 1}/${totalProblems} | 正确: ${correctAnswersCount} | 正确率: ${accuracy}%`;
      } else {
        statsEl.textContent = '';
      }
    }

    function updateProgress() {
      if (currentChapterData) {
        const progressPercentage = ((currentProblemIndex + 1) / currentChapterData.problems.length) * 100;
        progressFillEl.style.width = `${progressPercentage}%`;
      }
    }

    function toggleBookmark(problemId) {
      if (bookmarkedProblems[problemId]) {
        delete bookmarkedProblems[problemId];
      } else {
        bookmarkedProblems[problemId] = true;
      }
      localStorage.setItem('bookmarkedMultiplyProblems', JSON.stringify(bookmarkedProblems));
      updateBookmarkButton();
    }
    
    function updateBookmarkButton() {
        if (!currentChapterData || !currentChapterData.problems[currentProblemIndex]) return;
        const problemId = currentChapterData.problems[currentProblemIndex].id;
        if (bookmarkedProblems[problemId]) {
            markBtnEl.classList.add('active'); 
            markBtnEl.textContent = '已收藏 ★';
        } else {
            markBtnEl.classList.remove('active');
            markBtnEl.textContent = '收藏本题';
        }
    }

    function init() {
      initChapters();
      checkAnswerBtnEl.addEventListener('click', checkAnswer);
      nextBtnEl.addEventListener('click', nextProblem);
      prevBtnEl.addEventListener('click', prevProblem);
      markBtnEl.addEventListener('click', () => {
        if (currentChapterData && currentChapterData.problems[currentProblemIndex]) {
          const problemId = currentChapterData.problems[currentProblemIndex].id;
          toggleBookmark(problemId);
        }
      });
    }

    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
